<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bodega Pirata — Escáner en vivo</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:system-ui;background:#111;color:white;max-width:560px;margin:auto;padding:18px}h1{color:#e2b43a}button,input{box-sizing:border-box;width:100%;padding:15px;margin:8px 0;font-size:17px;border-radius:9px}button{background:#e2b43a;border:0;font-weight:bold}input{background:#222;color:white;border:1px solid #777}#reader{width:100%;margin:16px auto}#msg{white-space:pre-wrap}small{color:#bbb}</style></head><body><h1>🏴‍☠️ Bodega Pirata</h1><p>Escáner de códigos de barras en vivo</p><label>URL de tu aplicación de inventario (termina en /exec)</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec"><button onclick="iniciar()">📷 Iniciar escaneo en vivo</button><button onclick="parar()">Detener cámara</button><div id="reader"></div><p id="msg">Al detectar un código, abriré Bodega Pirata con el código precargado.</p><label>Código manual (alternativa)</label><input id="codigo" inputmode="numeric" placeholder="840737199383"><button onclick="ir(document.getElementById('codigo').value)">Abrir producto</button><small>Usa HTTPS en un sitio externo (por ejemplo, GitHub Pages). No abras este archivo localmente. La URL se guarda solo en esta pestaña.</small><script>
let scanner=null,terminado=false;
function mensaje(x){document.getElementById('msg').textContent=x}
function ir(code){code=String(code).trim();if(!/^\d{8,14}$/.test(code)){mensaje('Código inválido');return}const raw=document.getElementById('url').value.trim();let u;try{u=new URL(raw);if(u.protocol!=='https:'||u.hostname!=='script.google.com'||!u.pathname.endsWith('/exec'))throw 0}catch(e){mensaje('Pega la URL /exec válida de Bodega Pirata.');terminado=false;return}u.searchParams.set('barcode',code);window.location.assign(u.toString())}
async function iniciar(){if(scanner)return;if(!window.Html5Qrcode){mensaje('No se pudo cargar el lector');return}terminado=false;scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:270,height:150}},async code=>{if(terminado)return;terminado=true;mensaje('Código detectado: '+code);await parar();ir(code)},()=>{});mensaje('Cámara activa: apunta al código de barras')}catch(e){scanner=null;mensaje('Error de cámara: '+e.message)}}
async function parar(){if(!scanner)return;let s=scanner;scanner=null;try{await s.stop();s.clear()}catch(e){}}
</script></body></html>
